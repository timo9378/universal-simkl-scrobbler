name: Release

# 這個 fork 沒有商店上架（上游的 deploy-beta / deploy-stable 用的是 trakt-tools 的
# bot token 和商店 ID，在這裡不可能跑通，已經刪掉）。安裝方式是下載 zip 解壓縮後
# 用「載入解壓縮」，所以 CI 的工作就是把可安裝的 zip 放到看得到的地方。
#
# 兩種觸發：
#   - 推 v* tag  → 建立 GitHub Release，zip 掛成附件（永久連結，給人下載）
#   - 手動跑     → 只上傳成 workflow artifact（90 天，自己測用，不會多出 Release）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 建立 Release 需要

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 不指定 version：package.json 的 packageManager 已經釘死了版本，兩邊都給
      # 會讓 action-setup@v4 直接報 "Multiple versions of pnpm specified" 而中止。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ⚠️ 這裡刻意不注入 SIMKL_CLIENT_ID。發布的 zip 不帶任何憑證，使用者在擴充的
      # 選項頁填自己的（simkl.com/settings/developer 免費、一分鐘）。
      #
      # 早期版本是把維護者的 client id 烙進 zip 的——照抄上游對 Trakt 的做法。但那在
      # Simkl 這裡是錯的取捨：建 Trakt app 麻煩到不值得要求每個使用者做，而 Simkl 兩分鐘
      # 就給一組。烙進去的代價是所有安裝者的流量都掛在同一組 id 上，而 Simkl 明文寫著
      # 違規會停權 client_id——一組被停，所有下載同一份 zip 的人一起斷。
      - name: Build
        env:
          # 可選：Simkl 沒有圖的少數條目才會退回 TMDb。沒設就是那些條目不顯示圖。
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: pnpm run build

      # 防止憑證再度被烙進發布物：任何一個 client id 長度的十六進位字串出現在 bundle
      # 裡就中止。是回歸測試，不是清潔癖——第一版就是這樣外流的。
      - name: Assert no credentials were bundled
        run: |
          if grep -rEoh '[0-9a-f]{64}' build/ | head -1 | grep -q .; then
            echo "::error::建置產物裡出現了 64 字元的十六進位字串，可能是被內嵌的 client id。"
            grep -rEl '[0-9a-f]{64}' build/ | head -5
            exit 1
          fi

      # build 內部就有打包（webpack.config.ts 的 runFinalSteps，production 才會做）。
      # 這裡只確認產物真的在，避免無聲地發一個空的 Release。
      - name: Verify artifacts
        run: |
          ls -lh dist/
          test -s dist/chrome.zip
          test -s dist/firefox.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-simkl-scrobbler
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/chrome.zip
            dist/firefox.zip
          generate_release_notes: true
          body: |
            ## 安裝

            **Chrome / Edge** — 下載 `chrome.zip`
            1. 解壓縮到一個固定的資料夾（之後不能刪，瀏覽器每次啟動都要讀它）
            2. 開 `chrome://extensions/`（Edge 是 `edge://extensions/`）
            3. 開啟右下角的**開發人員模式**
            4. 點**載入解壓縮**，選剛才解壓縮出來的資料夾

            **Firefox** — 下載 `firefox.zip`
            1. 開 `about:debugging#/runtime/this-firefox`
            2. 點 **Load Temporary Add-on**，選 zip 檔本身（不用解壓縮）
            3. ⚠️ Firefox 的臨時擴充功能重開瀏覽器就會消失，這是 Firefox 對未簽章擴充功能的限制

            裝好之後點擴充功能圖示 → **Login with Simkl**，會開一個帶登入代碼的分頁，確認即可。

            ---

            ⚠️ **這個 fork 還沒有實機長期使用過。** 端點都對著正式 Simkl API 驗過，
            但沒有跑過長時間的真實觀看。最可能出問題的是動畫的集數對應——Simkl 以
            AniDB 為準，季數切法跟串流平台報的不一樣。建議先拿一般影集或電影試。

            這個 fork 為什麼存在，見 [README](https://github.com/timo9378/universal-simkl-scrobbler#readme)。
